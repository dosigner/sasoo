name: Build Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sasoo/**"
      - ".github/workflows/build-check.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sasoo

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            sasoo/pnpm-lock.yaml
            sasoo/frontend/pnpm-lock.yaml

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sasoo/backend/requirements.txt
            sasoo/backend/requirements-test.txt

      - name: Create backend virtualenv
        shell: pwsh
        run: python -m venv backend/.venv

      - name: Install backend packaging tools
        shell: pwsh
        run: .\backend\.venv\Scripts\python -m pip install --upgrade pip setuptools wheel pyinstaller

      - name: Install backend runtime dependencies
        shell: pwsh
        run: .\backend\.venv\Scripts\python -m pip install -r backend/requirements.txt

      - name: Install backend test dependencies
        shell: pwsh
        run: .\backend\.venv\Scripts\python -m pip install -r backend/requirements-test.txt

      - name: Install Node dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify version synchronization
        shell: bash
        run: |
          node scripts/sync-version.js
          git diff --exit-code

      - name: Run Electron unit tests
        shell: pwsh
        run: pnpm test:unit

      - name: Clean Windows build directories
        shell: pwsh
        run: pnpm clean:win

      - name: Compile Electron
        shell: pwsh
        run: pnpm build:electron

      - name: Type-check frontend
        shell: pwsh
        run: pnpm --dir=frontend tsc --noEmit

      - name: Run frontend unit tests
        shell: pwsh
        run: pnpm --dir=frontend test

      - name: Build frontend
        shell: pwsh
        run: pnpm --dir=frontend build

      - name: Lint frontend
        shell: pwsh
        run: pnpm --dir=frontend lint

      - name: Compile backend entrypoint
        shell: pwsh
        run: .\backend\.venv\Scripts\python -m py_compile backend/main.py

      - name: Run complete backend test suite
        shell: pwsh
        working-directory: sasoo/backend
        run: .\.venv\Scripts\python -m pytest services api models

      - name: Audit root dependencies
        shell: pwsh
        run: npx --yes pnpm@11.0.0 audit --audit-level=moderate

      - name: Audit frontend dependencies
        shell: pwsh
        run: npx --yes pnpm@11.0.0 --dir=frontend audit --audit-level=moderate

      # pnpm audit은 npm 생태계만 본다. 백엔드는 파이썬이라 여기서 따로 감사한다.
      # 이 단계가 없던 동안 Renovate가 파이썬 보안 PR을 올리는데도 CI는 초록이었다.
      # backend/.venv가 아니라 setup-python 쪽 인터프리터에 설치해 감사 대상을
      # 오염시키지 않는다. 주기 감사(dependency-audit.yml)와 명령을 똑같이 유지해라.
      - name: Install pip-audit
        shell: pwsh
        run: python -m pip install --quiet pip-audit==2.10.1

      # PYTHONUTF8=1이 없으면 Windows에서 깨진다. pip-audit이 쓰는
      # pip-requirements-parser는 옛 pip의 auto_decode를 벤더링했는데, BOM도 PEP 263
      # 주석도 없으면 locale 인코딩으로 폴백한다. Windows 런너는 cp1252라서
      # requirements.txt의 한글 주석에서 UnicodeDecodeError가 났다(run 33502266262).
      # UTF-8 모드는 locale.getpreferredencoding()이 무조건 utf-8을 반환하게 만든다.
      - name: Audit backend Python dependencies
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python -m pip_audit --progress-spinner=off -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Build unsigned Windows artifact
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SASOO_ALLOW_UNSIGNED_WIN: "1"
        run: |
          pnpm build:backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm verify:win-artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sasoo-windows-build-check
          if-no-files-found: error
          retention-days: 7
          path: |
            sasoo/dist/*.exe
            sasoo/dist/*.exe.blockmap
            sasoo/dist/latest.yml
