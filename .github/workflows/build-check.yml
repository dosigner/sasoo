name: Build Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sasoo/**"
      - ".github/workflows/build-check.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sasoo

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            sasoo/pnpm-lock.yaml
            sasoo/frontend/pnpm-lock.yaml

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sasoo/backend/requirements.txt
            sasoo/backend/requirements-test.txt

      - name: Prepare backend virtualenv
        shell: pwsh
        run: |
          python -m venv backend/.venv
          .\backend\.venv\Scripts\python -m pip install --upgrade pip setuptools wheel
          .\backend\.venv\Scripts\python -m pip install pyinstaller
          .\backend\.venv\Scripts\python -m pip install -r backend/requirements.txt
          .\backend\.venv\Scripts\python -m pip install -r backend/requirements-test.txt

      - name: Install Node dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify version synchronization
        shell: bash
        run: |
          node scripts/sync-version.js
          git diff --exit-code

      - name: Run tests and audits
        shell: pwsh
        run: |
          pnpm test:unit
          pnpm --dir frontend test
          pnpm --dir frontend build
          pnpm --dir frontend lint
          .\backend\.venv\Scripts\python -m py_compile backend/main.py
          Push-Location backend
          .\.venv\Scripts\python -m pytest services api models
          Pop-Location
          pnpm audit --audit-level=moderate
          pnpm --dir frontend audit --audit-level=moderate

      - name: Build unsigned Windows artifact
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm build:win

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sasoo-windows-build-check
          if-no-files-found: error
          retention-days: 7
          path: |
            sasoo/dist/*.exe
            sasoo/dist/*.exe.blockmap
            sasoo/dist/latest.yml
