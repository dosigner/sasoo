name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and attach to a draft release
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_flag: --win
          - os: macos-14
            builder_flag: --mac

    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: sasoo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0

      # ── Node + pnpm ──────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sasoo/pnpm-lock.yaml

      - name: Install Java for Windows packaging
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Python ───────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sasoo/backend/requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m venv backend/.venv
            source backend/.venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt pyinstaller
          else
            pip install -r backend/requirements.txt
            pip install pyinstaller
          fi

      # ── Node dependencies ────────────────────────
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          npm_config_frozen_lockfile: "false"

      # ── Build ────────────────────────────────────
      - name: Build (${{ runner.os }})
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            pnpm build:mac:release
          else
            pnpm build:win:release
          fi

      # ── Upload artifacts ─────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sasoo-${{ runner.os }}
          path: |
            sasoo/dist/*.exe
            sasoo/dist/*-mac.zip
            sasoo/dist/*.blockmap
            sasoo/dist/latest.yml
            sasoo/dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## macOS install note

          The macOS build is currently distributed as an unsigned ZIP.

          1. Extract the ZIP and move `Sasoo.app` to `/Applications`.
          2. If macOS says "`Sasoo` is damaged and can't be opened", run:

             ```bash
             xattr -dr com.apple.quarantine /Applications/Sasoo.app
             ```

          3. If launch is still blocked, right-click `Sasoo.app` and choose `Open`.
          EOF

          if ! gh release view "$TAG_NAME" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" -R "$GH_REPO" --draft --title "$TAG_NAME" --notes-file release-notes.md
          else
            gh release edit "$TAG_NAME" -R "$GH_REPO" --title "$TAG_NAME" --draft --notes-file release-notes.md
          fi

          gh release upload "$TAG_NAME" -R "$GH_REPO" artifacts/* --clobber
