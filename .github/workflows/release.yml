name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and attach to a draft release
        required: true
        type: string
      ref:
        description: Git ref to build from. Leave empty to build the tag itself.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-source.outputs.tag }}
      sha: ${{ steps.release-source.outputs.sha }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref) }}
          fetch-depth: 0
          persist-credentials: false

      - id: release-source
        name: Resolve and verify release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ "$TAG_NAME" != v* ]] || ! git check-ref-format "refs/tags/$TAG_NAME"; then
            echo "Release tag must be a valid Git tag beginning with v." >&2
            exit 1
          fi
          EXPECTED_TAG="v$(tr -d '\r\n' < sasoo/VERSION)"
          if [[ "$TAG_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG_NAME does not match application version $EXPECTED_TAG." >&2
            exit 1
          fi

          BUILD_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          TRUSTED_SHA="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")"
          if ! git merge-base --is-ancestor "$BUILD_SHA" "$TRUSTED_SHA"; then
            echo "Release source must already be part of $DEFAULT_BRANCH." >&2
            exit 1
          fi

          if TAG_SHA="$(git rev-parse --verify --quiet "refs/tags/$TAG_NAME^{commit}")"; then
            if [[ "$TAG_SHA" != "$BUILD_SHA" ]]; then
              echo "Release tag $TAG_NAME does not point to the selected build commit." >&2
              exit 1
            fi
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.7.0: macOS 단독 릴리스. Windows는 코드서명 인증서 확보 후 이 커밋을 revert해 복원한다.
          # 아래 "Configure and require Windows signing" 게이트는 그대로 보존한다.
          - os: macos-14
            builder_flag: --mac

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sasoo

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sasoo/pnpm-lock.yaml

      - name: Install Java for Windows packaging
        if: runner.os == 'Windows'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sasoo/backend/requirements.txt
            sasoo/backend/requirements-test.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m venv backend/.venv
            source backend/.venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt pyinstaller
          else
            pip install -r backend/requirements.txt -r backend/requirements-test.txt
            pip install pyinstaller
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version synchronization
        shell: bash
        run: |
          node scripts/sync-version.js
          git diff --exit-code

      - name: Run common quality gates
        shell: bash
        run: |
          pnpm test:unit
          pnpm --dir=frontend test
          pnpm --dir=frontend build
          pnpm --dir=frontend lint
          pnpm audit --audit-level=moderate
          pnpm --dir=frontend audit --audit-level=moderate

      - name: Run backend tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON="python"
          else
            PYTHON="backend/.venv/bin/python"
          fi
          "$PYTHON" -m py_compile backend/main.py
          cd backend
          "${PYTHON#backend/}" -m pytest services api models

      - name: Configure and require Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$WIN_CSC_LINK" || -z "$WIN_CSC_KEY_PASSWORD" ]]; then
            echo "Missing required Windows code-signing secrets." >&2
            exit 1
          fi

      - name: Build macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          pnpm build:mac:release

      - name: Build signed Windows release
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm build:win:release

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sasoo-${{ runner.os }}
          path: |
            sasoo/dist/*.exe
            sasoo/dist/*-mac.zip
            sasoo/dist/*.blockmap
            sasoo/dist/latest.yml
            sasoo/dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs:
      - resolve
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Require immutable releases
        env:
          IMMUTABLE_RELEASES_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ -z "$IMMUTABLE_RELEASES_TOKEN" ]]; then
            echo "Missing IMMUTABLE_RELEASES_TOKEN with Administration read permission." >&2
            exit 1
          fi
          if [[ "$(GH_TOKEN="$IMMUTABLE_RELEASES_TOKEN" gh api "repos/$GH_REPO/immutable-releases" --jq '.enabled')" != "true" ]]; then
            echo "Immutable releases must be enabled before publishing artifacts." >&2
            exit 1
          fi

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## macOS install note

          The macOS build is distributed as an unsigned, unnotarized ZIP. Only use an artifact downloaded directly from this official GitHub release.

          1. Extract the ZIP and move `Sasoo.app` to `/Applications`.
          2. If macOS says "`Sasoo` is damaged and can't be opened", run:

             ```bash
             xattr -dr com.apple.quarantine /Applications/Sasoo.app
             ```

          3. If launch is still blocked, right-click `Sasoo.app` and choose `Open`.

          This command removes quarantine protection. It does not verify the publisher or make the app pass Apple's signing and notarization checks. Do not use it on a copy obtained from a third party.
          EOF

          if gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "A release already exists for $TAG_NAME; refusing to modify it." >&2
            exit 1
          fi

          EXISTING_DRAFT="$(
            gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq 'map(select(.draft and (.tag_name == env.TAG_NAME or .name == env.TAG_NAME)))[0].id // empty'
          )"
          if [[ -n "$EXISTING_DRAFT" ]]; then
            echo "A draft release already exists for $TAG_NAME; refusing to modify it." >&2
            exit 1
          fi

          RELEASE_PAYLOAD="$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg name "$TAG_NAME" \
            --arg body "$(cat release-notes.md)" \
            --arg target "$BUILD_SHA" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              target_commitish: $target,
              draft: true
            }'
          )"
          RELEASE_JSON="$(
            gh api \
              --method POST \
              "repos/$GH_REPO/releases" \
              --input - <<<"$RELEASE_PAYLOAD"
          )"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE_JSON")"
          UPLOAD_URL="${UPLOAD_URL%%\{*}"

          for asset_path in artifacts/*; do
            CURRENT_RELEASE="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
            if [[ "$(jq -r '.draft' <<<"$CURRENT_RELEASE")" != "true" ]]; then
              echo "Release $TAG_NAME is no longer a draft; refusing to upload assets." >&2
              exit 1
            fi
            ASSET_NAME="$(jq -rn --arg name "$(basename "$asset_path")" '$name | @uri')"
            curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$asset_path" \
              "$UPLOAD_URL?name=$ASSET_NAME" \
              >/dev/null
          done

          echo "Artifacts uploaded. Draft releases remain unpublished for manual review."
