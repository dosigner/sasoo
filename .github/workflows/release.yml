name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and attach to a draft release
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_flag: --win
          - os: macos-14
            builder_flag: --mac

    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: sasoo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sasoo/pnpm-lock.yaml

      - name: Install Java for Windows packaging
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sasoo/backend/requirements.txt
            sasoo/backend/requirements-test.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m venv backend/.venv
            source backend/.venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt pyinstaller
          else
            pip install -r backend/requirements.txt -r backend/requirements-test.txt
            pip install pyinstaller
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version synchronization
        shell: bash
        run: |
          node scripts/sync-version.js
          git diff --exit-code

      - name: Run common quality gates
        shell: bash
        run: |
          pnpm test:unit
          pnpm --dir frontend test
          pnpm --dir frontend build
          pnpm --dir frontend lint
          pnpm audit --audit-level=moderate
          pnpm --dir frontend audit --audit-level=moderate

      - name: Run backend tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON="python"
          else
            PYTHON="backend/.venv/bin/python"
          fi
          "$PYTHON" -m py_compile backend/main.py
          cd backend
          "${PYTHON#backend/}" -m unittest discover -s services -t . -p 'test*.py'
          "${PYTHON#backend/}" -m unittest discover -s api -t . -p 'test*.py'

      - name: Configure and require Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$WIN_CSC_LINK" || -z "$WIN_CSC_KEY_PASSWORD" ]]; then
            echo "Missing required Windows code-signing secrets." >&2
            exit 1
          fi
          echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build (${{ runner.os }})
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            pnpm build:mac:release
          else
            pnpm build:win:release
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sasoo-${{ runner.os }}
          path: |
            sasoo/dist/*.exe
            sasoo/dist/*-mac.zip
            sasoo/dist/*.blockmap
            sasoo/dist/latest.yml
            sasoo/dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## macOS install note

          The macOS build is distributed as an unsigned, unnotarized ZIP. Only use an artifact downloaded directly from this official GitHub release.

          1. Extract the ZIP and move `Sasoo.app` to `/Applications`.
          2. If macOS says "`Sasoo` is damaged and can't be opened", run:

             ```bash
             xattr -dr com.apple.quarantine /Applications/Sasoo.app
             ```

          3. If launch is still blocked, right-click `Sasoo.app` and choose `Open`.

          This command removes quarantine protection. It does not verify the publisher or make the app pass Apple's signing and notarization checks. Do not use it on a copy obtained from a third party.
          EOF

          if RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" 2>/dev/null)"; then
            echo "Found existing release for $TAG_NAME"
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
            RELEASE_PAYLOAD="$(jq -n \
              --arg body "$(cat release-notes.md)" \
              '{
                body: $body
              }'
            )"
            gh api \
              --method PATCH \
              "repos/$GH_REPO/releases/$RELEASE_ID" \
              --input - <<<"$RELEASE_PAYLOAD" \
              >/dev/null
          else
            echo "No published release for $TAG_NAME; checking for an existing draft release"
            RELEASE_JSON="$(
              gh api "repos/$GH_REPO/releases?per_page=100" \
                --jq '.[] | select(.draft and (.tag_name == env.TAG_NAME or .name == env.TAG_NAME)) | @json' \
                | head -n 1
            )"

            if [[ -n "$RELEASE_JSON" ]]; then
              echo "Found existing draft release for $TAG_NAME"
              RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
              RELEASE_PAYLOAD="$(jq -n \
                --arg tag "$TAG_NAME" \
                --arg name "$TAG_NAME" \
                --arg body "$(cat release-notes.md)" \
                '{
                  tag_name: $tag,
                  name: $name,
                  body: $body
                }'
              )"
              gh api \
                --method PATCH \
                "repos/$GH_REPO/releases/$RELEASE_ID" \
                --input - <<<"$RELEASE_PAYLOAD" \
                >/dev/null
            else
              echo "No release exists for $TAG_NAME; creating a new draft release"
              RELEASE_PAYLOAD="$(jq -n \
                --arg tag "$TAG_NAME" \
                --arg name "$TAG_NAME" \
                --arg body "$(cat release-notes.md)" \
                '{
                  tag_name: $tag,
                  name: $name,
                  body: $body,
                  draft: true
                }'
              )"
              RELEASE_JSON="$(
                gh api \
                  --method POST \
                  "repos/$GH_REPO/releases" \
                  --input - <<<"$RELEASE_PAYLOAD"
              )"
              RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
            fi
          fi

          for asset_path in artifacts/*; do
            gh release upload "$TAG_NAME" "$asset_path" \
              --clobber \
              -R "$GH_REPO" \
              >/dev/null
          done

          echo "Artifacts uploaded. Draft releases remain unpublished for manual review."
