name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_flag: --win
          - os: macos-14
            builder_flag: --mac

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sasoo

    steps:
      - uses: actions/checkout@v4

      # ── Node + pnpm ──────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sasoo/pnpm-lock.yaml

      # ── Python ───────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sasoo/backend/requirements.txt

      - name: Materialize App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_RAW: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [[ -z "${APPLE_API_KEY_RAW}" ]]; then
            echo "APPLE_API_KEY secret is required for macOS notarization." >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_RAW" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m venv backend/.venv
            source backend/.venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt pyinstaller
          else
            pip install -r backend/requirements.txt
            pip install pyinstaller
          fi

      # ── Node dependencies ────────────────────────
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          npm_config_frozen_lockfile: "false"

      - name: Validate Apple release credentials
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node scripts/check-apple-credentials.js --require-release

      # ── Build ────────────────────────────────────
      - name: Build (${{ runner.os }})
        shell: bash
        env:
          CI_RELEASE: ${{ runner.os == 'macOS' && 'true' || '' }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            pnpm build:mac:release
          else
            pnpm build:backend && pnpm build:frontend && pnpm build:electron && npx electron-builder ${{ matrix.builder_flag }} --publish never
          fi

      # ── Upload artifacts ─────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sasoo-${{ runner.os }}
          path: |
            sasoo/dist/*.exe
            sasoo/dist/*.dmg
            sasoo/dist/*.zip
            sasoo/dist/*.blockmap
            sasoo/dist/*.yml
            sasoo/dist/*.yaml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/*.yml
            artifacts/*.yaml
