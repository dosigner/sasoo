name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and attach to a draft release
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_flag: --win
          - os: macos-14
            builder_flag: --mac

    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: sasoo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sasoo/pnpm-lock.yaml

      - name: Install Java for Windows packaging
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sasoo/backend/requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m venv backend/.venv
            source backend/.venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt pyinstaller
          else
            pip install -r backend/requirements.txt
            pip install pyinstaller
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          npm_config_frozen_lockfile: "false"

      - name: Build (${{ runner.os }})
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            pnpm build:mac:release
          else
            pnpm build:win:release
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sasoo-${{ runner.os }}
          path: |
            sasoo/dist/*.exe
            sasoo/dist/*-mac.zip
            sasoo/dist/*.blockmap
            sasoo/dist/latest.yml
            sasoo/dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## macOS install note

          The macOS build is currently distributed as an unsigned ZIP.

          1. Extract the ZIP and move `Sasoo.app` to `/Applications`.
          2. If macOS says "`Sasoo` is damaged and can't be opened", run:

             ```bash
             xattr -dr com.apple.quarantine /Applications/Sasoo.app
             ```

          3. If launch is still blocked, right-click `Sasoo.app` and choose `Open`.
          EOF

          RELEASE_JSON=""

          if RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" 2>/dev/null)"; then
            echo "Found existing release for $TAG_NAME"
          else
            echo "No tagged release for $TAG_NAME; looking for a reusable draft release"
            RELEASE_JSON="$(
              gh api "repos/$GH_REPO/releases?per_page=100" \
                --jq '.[] | select(.draft and .name == env.TAG_NAME) | @json' \
                | head -n 1
            )"
          fi

          RELEASE_PAYLOAD="$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg name "$TAG_NAME" \
            --arg body "$(cat release-notes.md)" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              draft: true
            }'
          )"

          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
            gh api \
              --method PATCH \
              "repos/$GH_REPO/releases/$RELEASE_ID" \
              --input - <<<"$RELEASE_PAYLOAD" \
              >/dev/null
          else
            RELEASE_JSON="$(
              gh api \
                --method POST \
                "repos/$GH_REPO/releases" \
                --input - <<<"$RELEASE_PAYLOAD"
            )"
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          fi

          RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE_JSON" | sed 's/{?name,label}//')"

          for asset_path in artifacts/*; do
            asset_name="$(basename "$asset_path")"
            existing_asset_id="$(
              jq -r --arg name "$asset_name" \
                '.assets[]? | select(.name == $name) | .id' \
                <<<"$RELEASE_JSON" \
                | head -n 1
            )"

            if [[ -n "$existing_asset_id" ]]; then
              gh api \
                --method DELETE \
                "repos/$GH_REPO/releases/assets/$existing_asset_id" \
                >/dev/null
            fi

            encoded_name="$(jq -rn --arg v "$asset_name" '$v|@uri')"
            content_type="$(file --brief --mime-type "$asset_path")"

            gh api \
              --method POST \
              --header "Content-Type: $content_type" \
              "${UPLOAD_URL}?name=${encoded_name}" \
              --input "$asset_path" \
              >/dev/null
          done

          gh api \
            --method PATCH \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            --input - <<EOF
          {
            "draft": false
          }
          EOF
