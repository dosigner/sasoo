name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to upload assets to (for example v0.6.6)"
        required: true
        type: string
      ref:
        description: "Git ref to build from. Leave empty to build the tag itself."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      ref: ${{ steps.vars.outputs.ref }}

    steps:
      - id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            REF="${{ inputs.ref }}"
            if [[ -z "$REF" ]]; then
              REF="$TAG"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  mac:
    needs: resolve
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare backend virtualenv
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip setuptools wheel
          backend/.venv/bin/python -m pip install pyinstaller
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Install Node dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Build macOS release
        shell: bash
        run: pnpm build:mac:release

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml

  windows:
    needs: resolve
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare backend virtualenv
        shell: pwsh
        run: |
          python -m venv backend/.venv
          .\backend\.venv\Scripts\python -m pip install --upgrade pip setuptools wheel
          .\backend\.venv\Scripts\python -m pip install pyinstaller
          .\backend\.venv\Scripts\python -m pip install -r backend/requirements.txt

      - name: Install Node dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows release
        shell: pwsh
        run: pnpm build:win:release

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  publish:
    needs:
      - resolve
      - mac
      - windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          PREV_TAG="$(
            python3 - <<'PY'
import os
import re
import subprocess

target = os.environ["TAG"]
match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", target)
if not match:
    raise SystemExit(0)

current = tuple(int(part) for part in match.groups())
tags = subprocess.check_output(["git", "tag"], text=True).splitlines()
older = []

for tag in tags:
    parsed = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
    if not parsed:
        continue
    version = tuple(int(part) for part in parsed.groups())
    if version < current:
        older.append((version, tag))

if older:
    print(max(older)[1])
PY
          )"

          if [[ -n "$PREV_TAG" ]]; then
            RANGE="$PREV_TAG..$TAG"
            COMPARE_LINE="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
          else
            RANGE="$TAG"
            COMPARE_LINE=""
          fi

          git log --no-merges --pretty='- %s' "$RANGE" \
            | grep -Ev '^- release: prepare ' \
            > release-commits.md

          if [[ ! -s release-commits.md ]]; then
            git log -1 --pretty='- %s' "$TAG" > release-commits.md
          fi

          {
            echo "## Included Changes"
            echo
            cat release-commits.md
            echo
            echo "## Install Notes"
            echo
            echo "- macOS: extract the ZIP, move \`Sasoo.app\` to \`/Applications\`, and if Gatekeeper blocks launch run \`xattr -dr com.apple.quarantine /Applications/Sasoo.app\`."
            echo "- Windows: install with the bundled \`.exe\` installer. Auto-update metadata is published in \`latest.yml\`."
            if [[ -n "$COMPARE_LINE" ]]; then
              echo
              echo "$COMPARE_LINE"
            fi
          } > release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          ls -la release-assets

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG"
          fi

          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --input - <<EOF
          {
            "name": "$TAG",
            "body": $(jq -Rs . < release-notes.md)
          }
          EOF

          gh release upload "$TAG" release-assets/* --clobber
