name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to upload assets to (for example v0.6.6)"
        required: true
        type: string
      ref:
        description: "Git ref to build from. Leave empty to build the tag itself."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      ref: ${{ steps.vars.outputs.ref }}

    steps:
      - id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            REF="${{ inputs.ref }}"
            if [[ -z "$REF" ]]; then
              REF="$TAG"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  mac:
    needs: resolve
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare backend virtualenv
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip setuptools wheel
          backend/.venv/bin/python -m pip install pyinstaller
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Install Node dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Configure macOS signing (env-gated)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only inject secrets into the build environment when they are actually
          # set. An empty CSC_LINK would make electron-builder call
          # importCertificate("") and break the build, so absent secrets must
          # leave the environment untouched (identical to the unsigned pipeline).
          SIGNING="DISABLED"
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" ]]; then
            {
              echo "CSC_LINK=$CSC_LINK"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            SIGNING="ENABLED"
          else
            # No certificate: disable auto-discovery so electron-builder does not
            # try to sign with an unrelated keychain identity.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

          NOTARIZE="DISABLED"
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            NOTARIZE="ENABLED"
          fi

          echo "macOS code signing: $SIGNING"
          echo "macOS notarization: $NOTARIZE"

      - name: Build macOS release
        shell: bash
        run: pnpm build:mac:release

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml

  windows:
    needs: resolve
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare backend virtualenv
        shell: pwsh
        run: |
          python -m venv backend/.venv
          .\backend\.venv\Scripts\python -m pip install --upgrade pip setuptools wheel
          .\backend\.venv\Scripts\python -m pip install pyinstaller
          .\backend\.venv\Scripts\python -m pip install -r backend/requirements.txt

      - name: Install Node dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Cache Java runtime
        uses: actions/cache@v4
        with:
          path: backend/.jre-cache
          key: jre-${{ runner.os }}-jdk-21.0.10+7

      - name: Configure Windows signing (env-gated)
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Same gating rationale as macOS: only inject the certificate when it
          # exists, otherwise electron-builder auto-skips Windows signing.
          SIGNING="DISABLED"
          if [[ -n "$WIN_CSC_LINK" && -n "$WIN_CSC_KEY_PASSWORD" ]]; then
            {
              echo "WIN_CSC_LINK=$WIN_CSC_LINK"
              echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            SIGNING="ENABLED"
          fi
          echo "Windows code signing: $SIGNING"

      - name: Build Windows release
        shell: pwsh
        run: pnpm build:win:release

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  publish:
    needs:
      - resolve
      - mac
      - windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          PREV_TAG="$(python3 .github/scripts/previous_tag.py)"

          if [[ -n "$PREV_TAG" ]]; then
            RANGE="$PREV_TAG..$TAG"
            COMPARE_LINE="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
          else
            RANGE="$TAG"
            COMPARE_LINE=""
          fi

          git log --no-merges --pretty='- %s' "$RANGE" \
            | grep -Ev '^- release: prepare ' \
            > release-commits.md

          if [[ ! -s release-commits.md ]]; then
            git log -1 --pretty='- %s' "$TAG" > release-commits.md
          fi

          {
            echo "## Included Changes"
            echo
            cat release-commits.md
            echo
            echo "## Install Notes"
            echo
            echo "- macOS: extract the ZIP, move \`Sasoo.app\` to \`/Applications\`, and if Gatekeeper blocks launch run \`xattr -dr com.apple.quarantine /Applications/Sasoo.app\`."
            echo "- Windows: install with the bundled \`.exe\` installer. Auto-update metadata is published in \`latest.yml\`."
            if [[ -n "$COMPARE_LINE" ]]; then
              echo
              echo "$COMPARE_LINE"
            fi
          } > release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          ls -la release-assets

          TARGET_COMMITISH="$(git rev-parse HEAD)"
          CREATED_DRAFT_RELEASE="false"

          if RELEASE_JSON="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null)"; then
            echo "Found existing release for $TAG"
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
            RELEASE_PAYLOAD="$(jq -n \
              --arg body "$(cat release-notes.md)" \
              --arg target "$TARGET_COMMITISH" \
              '{
                target_commitish: $target,
                body: $body
              }'
            )"
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              --input - <<<"$RELEASE_PAYLOAD" \
              >/dev/null
          else
            echo "No tagged release for $TAG; creating a new draft release"
            RELEASE_PAYLOAD="$(jq -n \
              --arg tag "$TAG" \
              --arg name "$TAG" \
              --arg body "$(cat release-notes.md)" \
              --arg target "$TARGET_COMMITISH" \
              '{
                tag_name: $tag,
                target_commitish: $target,
                name: $name,
                body: $body,
                draft: true
              }'
            )"
            RELEASE_JSON="$(
              gh api \
                --method POST \
                "repos/${{ github.repository }}/releases" \
                --input - <<<"$RELEASE_PAYLOAD"
            )"
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
            CREATED_DRAFT_RELEASE="true"
          fi

          RELEASE_JSON="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE_JSON" | sed 's/{?name,label}//')"

          for asset_path in release-assets/*; do
            asset_name="$(basename "$asset_path")"
            existing_asset_id="$(
              jq -r --arg name "$asset_name" \
                '.assets[]? | select(.name == $name) | .id' \
                <<<"$RELEASE_JSON" \
                | head -n 1
            )"

            if [[ -n "$existing_asset_id" ]]; then
              gh api \
                --method DELETE \
                "repos/${{ github.repository }}/releases/assets/$existing_asset_id" \
                >/dev/null
            fi

            encoded_name="$(jq -rn --arg v "$asset_name" '$v|@uri')"
            content_type="$(file --brief --mime-type "$asset_path")"

            gh api \
              --method POST \
              --header "Content-Type: $content_type" \
              "${UPLOAD_URL}?name=${encoded_name}" \
              --input "$asset_path" \
              >/dev/null
          done

          if [[ "$CREATED_DRAFT_RELEASE" == "true" ]]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              --input - <<EOF
          {
            "draft": false
          }
          EOF
          fi
