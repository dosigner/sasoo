name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Python syntax check
        run: python -m py_compile main.py

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify version sync
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          ROOT_VER=$(node -p "require('./package.json').version")
          FE_VER=$(node -p "require('./frontend/package.json').version")
          echo "VERSION file: $VERSION"
          echo "Root package.json: $ROOT_VER"
          echo "Frontend package.json: $FE_VER"
          if [ "$VERSION" != "$ROOT_VER" ] || [ "$VERSION" != "$FE_VER" ]; then
            echo "::error::Version mismatch! Run 'node scripts/sync-version.js'"
            exit 1
          fi
          echo "All versions match: $VERSION"
