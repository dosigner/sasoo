[package]
name = "sasoo-backend"
version = "1.3.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[features]
pdf-xberg-native = ["dep:xberg-native-pdf"]

[[example]]
name = "pdf_probe"
required-features = ["pdf-xberg-native"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "multipart"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
uuid = { version = "=1.28.0", features = ["serde", "v4"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
percent-encoding = "=2.3.2"
subtle = "=2.6.1"
rusqlite = { version = "=0.42.0", features = ["bundled", "backup"] }
tokio-util = { version = "=0.7.18", features = ["rt", "io"] }

fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto"] }
secrecy = "=0.10.3"
rust_decimal = { version = "=1.43.0", features = ["serde"] }
base64 = "=0.22.1"
md5 = "=0.8.0"
httpdate = "=1.0.3"
mime_guess = "=2.0.5"
regex = "=1.13.1"
unicode-normalization = "=0.1.26"
xberg-native-pdf = { version = "=1.3.10", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "=3.27.0"
http-body-util = "=0.1.3"
tower = { version = "=0.5.3", features = ["util"] }

[patch.crates-io]
xberg-native-pdf = { path = "vendor/xberg-native-pdf" }
