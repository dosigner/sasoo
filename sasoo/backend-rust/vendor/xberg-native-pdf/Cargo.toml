description = "PDF parsing, extraction and rendering -- the native PDF engine behind xberg."
documentation = "https://docs.rs/xberg-native-pdf"
readme = "README.md"
keywords = [
    "pdf",
    "text-extraction",
    "pdf-parser",
    "pdf-rendering",
    "document-parser",
]
categories = [
    "parsing",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/xberg-io/xberg"
resolver = "2"

